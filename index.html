<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carimbo — marca d'água local</title>
<style>
  :root {
    --ink: #12161d;
    --panel: #1a212b;
    --panel-2: #212a36;
    --line: #2c3746;
    --text: #e7ebf1;
    --muted: #8a94a6;
    --seal: #e0a54a;
    --seal-dim: rgba(224,165,74,.15);
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 28px 20px 48px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header { margin-bottom: 26px; }
  .brand {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  h1 {
    font-size: 26px; font-weight: 680; letter-spacing: -0.02em;
  }
  .stamp {
    display: inline-block; font-size: 12px; font-weight: 600;
    color: var(--seal); border: 1px solid var(--seal);
    padding: 3px 9px; border-radius: 40px;
    transform: rotate(-3deg);
  }
  .sub {
    margin-top: 8px; color: var(--muted); font-size: 14.5px; max-width: 62ch;
  }
  .sub b { color: var(--text); font-weight: 600; }

  .grid {
    display: grid; grid-template-columns: 320px 1fr; gap: 20px; margin-top: 24px;
    align-items: start;
  }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px;
  }
  .panel h2 {
    font-size: 12.5px; font-weight: 600; color: var(--muted);
    margin-bottom: 14px;
  }

  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  label:first-of-type { margin-top: 0; }

  input[type=text], select {
    width: 100%; background: var(--ink); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font-size: 14px; font-family: inherit;
  }
  input[type=text]:focus, select:focus {
    outline: 2px solid var(--seal); outline-offset: 1px; border-color: transparent;
  }

  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }

  .rangewrap { display: flex; align-items: center; gap: 10px; }
  input[type=range] { flex: 1; accent-color: var(--seal); }
  .val { font-size: 13px; color: var(--text); min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }

  .colorrow { display: flex; align-items: center; gap: 10px; }
  input[type=color] {
    width: 40px; height: 34px; padding: 0; border: 1px solid var(--line);
    border-radius: 8px; background: var(--ink); cursor: pointer;
  }

  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; background: var(--ink); color: var(--muted);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .seg button[aria-pressed=true] {
    background: var(--seal-dim); color: var(--seal); border-color: var(--seal);
  }

  /* Preview side */
  .stage {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; min-height: 340px;
    display: flex; flex-direction: column;
  }
  .drop {
    position: relative;
    flex: 1; border: 1.5px dashed var(--line); border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 40px 20px; cursor: pointer;
    transition: border-color .15s, background .15s; min-height: 300px;
  }
  .drop input[type=file] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer;
  }
  .drop:hover, .drop.over { border-color: var(--seal); background: var(--seal-dim); }
  .drop .big { font-size: 15px; color: var(--text); font-weight: 560; }
  .drop .small { font-size: 13px; color: var(--muted); }
  .drop svg { opacity: .5; }

  .canvas-holder { flex: 1; display: none; flex-direction: column; gap: 14px; }
  .canvas-holder.show { display: flex; }
  canvas {
    max-width: 100%; height: auto; border-radius: 6px;
    align-self: center; background:
      repeating-conic-gradient(#242c38 0% 25%, #1c232e 0% 50%) 50% / 20px 20px;
  }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px;
    font-weight: 560; cursor: pointer; font-family: inherit;
  }
  .btn.primary { background: var(--seal); color: #241a08; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn.ghost:hover { color: var(--text); border-color: var(--muted); }

  .meta { font-size: 12.5px; color: var(--muted); margin-top: auto; padding-top: 12px; }
  .dot { color: var(--seal); }

  footer { margin-top: 30px; font-size: 12.5px; color: var(--muted); }
  footer code { color: var(--text); background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Carimbo</h1>
      <span class="stamp">roda no seu navegador</span>
    </div>
    <p class="sub">Marca d'água em imagem sem upload. A imagem é lida, carimbada e baixada
      <b>dentro da própria aba</b> — nada trafega pela rede.</p>
  </header>

  <div class="grid">
    <!-- Controls -->
    <div class="panel">
      <h2>Ajustes</h2>

      <label for="txt">Texto da marca</label>
      <input type="text" id="txt" value="CONFIDENCIAL" autocomplete="off" spellcheck="false">

      <label>Disposição</label>
      <div class="seg" id="mode">
        <button data-mode="tile" aria-pressed="true">Repetido</button>
        <button data-mode="single" aria-pressed="false">Único</button>
      </div>

      <div id="posWrap" style="display:none">
        <label for="pos">Posição</label>
        <select id="pos">
          <option value="center">Centro</option>
          <option value="br">Canto inferior direito</option>
          <option value="bl">Canto inferior esquerdo</option>
          <option value="tr">Canto superior direito</option>
          <option value="tl">Canto superior esquerdo</option>
        </select>
      </div>

      <label for="size">Tamanho <span style="color:var(--muted)">(% da largura)</span></label>
      <div class="rangewrap">
        <input type="range" id="size" min="2" max="20" value="6" step="0.5">
        <span class="val" id="sizeVal">6%</span>
      </div>

      <label for="op">Opacidade</label>
      <div class="rangewrap">
        <input type="range" id="op" min="5" max="100" value="35" step="1">
        <span class="val" id="opVal">35%</span>
      </div>

      <label for="rot">Rotação</label>
      <div class="rangewrap">
        <input type="range" id="rot" min="-90" max="90" value="-30" step="1">
        <span class="val" id="rotVal">-30°</span>
      </div>

      <div id="gapWrap">
        <label for="gap">Espaçamento</label>
        <div class="rangewrap">
          <input type="range" id="gap" min="1" max="4" value="2" step="0.1">
          <span class="val" id="gapVal">2.0×</span>
        </div>
      </div>

      <label>Cor</label>
      <div class="colorrow">
        <input type="color" id="color" value="#ffffff">
        <input type="text" id="colorHex" value="#ffffff" spellcheck="false" style="flex:1">
      </div>
    </div>

    <!-- Preview -->
    <div class="stage">
      <label class="drop" id="drop">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        <div class="big">Toque para escolher uma imagem</div>
        <div class="small">ou solte aqui · PNG, JPG ou WebP</div>
        <input type="file" id="file" accept="image/*">
      </label>

      <div class="canvas-holder" id="holder">
        <canvas id="canvas"></canvas>
        <div class="actions">
          <button class="btn primary" id="download">Baixar imagem</button>
          <button class="btn ghost" id="reset">Trocar imagem</button>
        </div>
        <div class="meta" id="meta"></div>
      </div>
    </div>
  </div>

  <footer>
    Feito pra rodar solto: salva o arquivo <code>index.html</code> e abre no navegador, offline, quando quiser.
  </footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('canvas'), ctx = canvas.getContext('2d');
  let img = null, fileName = 'imagem';

  const state = {
    text: 'CONFIDENCIAL', mode: 'tile', pos: 'center',
    size: 6, opacity: 35, rotation: -30, gap: 2, color: '#ffffff'
  };

  // ---- input wiring ----
  $('txt').addEventListener('input', e => { state.text = e.target.value; render(); });

  document.querySelectorAll('#mode button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#mode button').forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      state.mode = b.dataset.mode;
      $('posWrap').style.display = state.mode === 'single' ? 'block' : 'none';
      $('gapWrap').style.display = state.mode === 'tile' ? 'block' : 'none';
      render();
    });
  });
  $('pos').addEventListener('change', e => { state.pos = e.target.value; render(); });

  const bindRange = (id, valId, key, fmt) => {
    $(id).addEventListener('input', e => {
      state[key] = parseFloat(e.target.value);
      $(valId).textContent = fmt(state[key]);
      render();
    });
  };
  bindRange('size', 'sizeVal', 'size', v => v + '%');
  bindRange('op', 'opVal', 'opacity', v => v + '%');
  bindRange('rot', 'rotVal', 'rotation', v => v + '°');
  bindRange('gap', 'gapVal', 'gap', v => v.toFixed(1) + '×');

  const syncColor = v => {
    if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;
    state.color = v; $('color').value = v; $('colorHex').value = v; render();
  };
  $('color').addEventListener('input', e => syncColor(e.target.value));
  $('colorHex').addEventListener('input', e => syncColor(e.target.value.trim()));

  // ---- file handling (never leaves the page) ----
  const drop = $('drop'), fileInput = $('file');
  fileInput.addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));

  ['dragenter', 'dragover'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => {
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadFile(f);
  });

  function loadFile(f) {
    fileName = f.name.replace(/\.[^.]+$/, '') || 'imagem';
    const reader = new FileReader();
    reader.onload = ev => {
      const i = new Image();
      i.onload = () => {
        img = i;
        drop.style.display = 'none';
        $('holder').classList.add('show');
        render();
      };
      i.src = ev.target.result;
    };
    reader.readAsDataURL(f); // local, in-memory — no network
  }

  $('reset').addEventListener('click', () => {
    img = null; fileInput.value = '';
    $('holder').classList.remove('show');
    drop.style.display = 'flex';
  });

  // ---- render at full resolution ----
  function hexToRgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  }

  function render() {
    if (!img) return;
    const W = img.naturalWidth, H = img.naturalHeight;
    canvas.width = W; canvas.height = H;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0);

    const text = state.text || '';
    if (!text.trim()) { updateMeta(W, H); return; }

    const fontPx = Math.max(10, (state.size / 100) * W);
    ctx.font = `600 ${fontPx}px ui-sans-serif, -apple-system, "Segoe UI", sans-serif`;
    ctx.fillStyle = hexToRgba(state.color, state.opacity / 100);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const rad = state.rotation * Math.PI / 180;

    if (state.mode === 'single') {
      const m = ctx.measureText(text);
      const pad = fontPx * 0.7;
      let x = W / 2, y = H / 2;
      const half = m.width / 2 + pad;
      if (state.pos !== 'center') {
        if (state.pos.includes('l')) x = half;
        if (state.pos.includes('r')) x = W - half;
        if (state.pos.includes('t')) y = fontPx / 2 + pad;
        if (state.pos.includes('b')) y = H - fontPx / 2 - pad;
      }
      ctx.save(); ctx.translate(x, y); ctx.rotate(rad); ctx.fillText(text, 0, 0); ctx.restore();
    } else {
      const m = ctx.measureText(text);
      const stepX = (m.width + fontPx) * state.gap;
      const stepY = fontPx * 2 * state.gap;
      const diag = Math.sqrt(W * W + H * H);
      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.rotate(rad);
      for (let y = -diag; y < diag; y += stepY) {
        const offset = (Math.round(y / stepY) % 2) * stepX / 2;
        for (let x = -diag; x < diag; x += stepX) {
          ctx.fillText(text, x + offset, y);
        }
      }
      ctx.restore();
    }
    updateMeta(W, H);
  }

  function updateMeta(W, H) {
    $('meta').innerHTML = `<span class="dot">●</span> ${W}×${H}px · ${fileName} · processado localmente`;
  }

  $('download').addEventListener('click', () => {
    if (!img) return;
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${fileName}-marca.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  });
})();
</script>
</body>
</html>
